name: Feature request / 功能建议
description: Describe a concrete problem and a small, useful improvement.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为与验收标准
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
